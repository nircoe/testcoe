name: Windows

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        name: ${{ matrix.name }}
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: "Windows MSVC"
                      compiler: msvc
                      cmake-generator: ''
                      cmake-options: ''
                    
                    - name: "Windows MinGW"
                      compiler: gcc
                      cmake-generator: 'MinGW Makefiles'
                      cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'

        steps:
        - name: Checkout repository
          uses: actions/checkout@v3
          with:
            submodules: 'recursive'

        - name: Install Windows build tools
          if: matrix.compiler != 'msvc'
          run: |
            choco install mingw
          shell: bash
        
        - name: Configure CMake
          run: |
            if [ -n "${{ matrix.cmake-generator }}" ]; then
              cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} -DTESTCOE_BUILD_EXAMPLES=ON -DTESTCOE_BUILD_TESTS=ON
            else
              cmake -B build ${{ matrix.cmake-options }} -DTESTCOE_BUILD_EXAMPLES=ON -DTESTCOE_BUILD_TESTS=ON
            fi
            
          shell: bash

        - name: Build
          run: |
            cmake --build build --config Release
          shell: bash
        
        - name: Run tests
          working-directory: build
          run: |
            if [ "${{ matrix.compiler }}" == "gcc" ]; then
                ./tests/testcoe_tests.exe
            else
                ./tests/Release/testcoe_tests.exe
            fi 
          shell: bash