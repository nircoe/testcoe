name: macOS

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main]

jobs:
    build-and-test:
        name: ${{ matrix.name }}
        runs-on: macos-latest
        if: github.event.pull_request.draft == false || github.event_name == 'push'
        env:
            CACHE_CMAKE_OPTIONS: '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: "macOS Clang"
                      compiler: clang
                      cmake-generator: 'Ninja'
                      cmake-options: '-DCMAKE_BUILD_TYPE=Release'

        steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup ccache
          uses: hendrikmuhs/ccache-action@v1.2
          with:
            key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{
              hashFiles('cmake/googletest.cmake', 'tests/CMakeLists.txt') }}
            restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-

        - name: Configure CMake
          run: |
            cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} \
                ${{ env.CACHE_CMAKE_OPTIONS }} -DTESTCOE_BUILD_EXAMPLES=ON -DTESTCOE_BUILD_TESTS=ON
          shell: bash

        - name: Build
          run: |
            cmake --build build --parallel
          shell: bash
        
        - name: Run tests
          working-directory: build/tests
          run: |
            ./testcoe_tests
          shell: bash